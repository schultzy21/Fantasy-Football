<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baruka Ta Adenine League Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#0F1729;
    --panel:#16213C;
    --panel2:#1C2A4A;
    --line:#28375C;
    --chalk:#F5F3EC;
    --muted:#8A96B0;
    --gold:#E8B04B;
    --turf:#3FB27F;
    --flag:#E5533C;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:20px 18px 80px}
  .tnum{font-variant-numeric:tabular-nums}
  .display{font-weight:800;letter-spacing:.02em;text-transform:uppercase}

  /* Top bar */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
       padding-bottom:16px;border-bottom:2px solid var(--line);margin-bottom:8px}
  .brand h1{font-size:30px;line-height:1.02;margin:0;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
  .brand .sub{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
  .weekpill{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
       border-radius:999px;padding:8px 14px;font-size:13px;letter-spacing:.04em}
  .weekpill b{color:var(--gold)}
  .top .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .idbox{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 10px}
  .idbox label{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .idbox input{background:transparent;border:none;color:var(--chalk);width:150px;font-size:13px;outline:none}
  button{cursor:pointer;font-family:inherit}
  .btn{background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:10px;
       padding:8px 12px;font-size:13px;font-weight:600;letter-spacing:.02em}
  .btn:hover{border-color:var(--gold)}
  .btn.gold{background:var(--gold);color:#20160a;border-color:var(--gold)}
  .btn.ghost{background:transparent}
  .btn:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* Tabs */
  nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 22px;padding-bottom:4px;scrollbar-width:thin}
  .tab{white-space:nowrap;background:transparent;border:none;color:var(--muted);
       padding:10px 14px;font-size:14px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
       border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
  .tab:hover{color:var(--chalk)}
  .tab.active{color:var(--chalk);border-bottom-color:var(--gold)}

  section.view{display:none;animation:rise .35s ease both}
  section.view.active{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card + .card{margin-top:16px}
  .eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  h2.sec{font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
  .lead{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:64ch}

  /* Standings + tables */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  td.num,th.num{text-align:right}
  tr:last-child td{border-bottom:none}
  .team-cell{display:flex;align-items:center;gap:11px;min-width:0}
  .badge{width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:grid;place-items:center;
         font-weight:800;font-size:13px;color:#0e1424;letter-spacing:.02em;background:var(--gold)}
  .team-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team-sub{color:var(--muted);font-size:12px}

  /* Power rankings export card */
  .rk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  #exportCard{background:linear-gradient(180deg,#101a33 0%,#0d1730 100%);
              border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .rk-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .rk-title .name{font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .rk-title .wk{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .rk-stamp{color:var(--muted);font-size:12px;letter-spacing:.05em;margin-bottom:18px}
  .rk-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
  .rk-row:first-of-type{border-top:none}
  .rk-num{font-size:34px;font-weight:800;line-height:1;width:52px;text-align:center;color:var(--chalk)}
  .rk-1 .rk-num{color:var(--gold)}
  .rk-badge{width:44px;height:44px;flex:0 0 44px;border-radius:11px;display:grid;place-items:center;
            font-weight:800;font-size:16px;color:#0e1424;background:var(--gold)}
  .rk-main{flex:1 1 auto;min-width:0}
  .rk-name{font-size:17px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rk-meta{color:var(--muted);font-size:12.5px;margin-top:2px;letter-spacing:.03em}
  .rk-blurb{font-size:13.5px;color:#c9d3e6;margin-top:7px;max-width:70ch}
  .move{font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.03em}
  .move.up{color:var(--turf);background:rgba(63,178,127,.14)}
  .move.down{color:var(--flag);background:rgba(229,83,60,.14)}
  .move.flat{color:var(--muted);background:rgba(138,150,176,.14)}
  .crown{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .rk-foot{margin-top:16px;color:var(--muted);font-size:11px;letter-spacing:.04em}

  /* Recap */
  .matchup{display:flex;align-items:stretch;justify-content:space-between;gap:10px;
           background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .side{display:flex;align-items:center;gap:10px;flex:1 1 0;min-width:0}
  .side.right{justify-content:flex-end;text-align:right}
  .side .pts{font-size:20px;font-weight:800}
  .win .pts{color:var(--turf)}
  .lose{opacity:.7}
  .vs{align-self:center;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.1em}
  .flagline{display:flex;align-items:center;gap:10px;background:rgba(229,83,60,.12);
            border:1px solid rgba(229,83,60,.4);border-radius:12px;padding:12px 14px;margin-top:6px}
  .flagchip{background:var(--flag);color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em;
            text-transform:uppercase;padding:4px 8px;border-radius:6px}
  .highline{display:flex;align-items:center;gap:10px;background:rgba(232,176,75,.1);
            border:1px solid rgba(232,176,75,.4);border-radius:12px;padding:12px 14px;margin-bottom:6px}
  .highchip{background:var(--gold);color:#20160a;font-weight:800;font-size:11px;letter-spacing:.08em;
            text-transform:uppercase;padding:4px 8px;border-radius:6px}

  /* Predictions grid */
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.pgrid{grid-template-columns:1fr}}
  .pcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
  .pcard .plabel{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .pcard.fav .plabel{color:var(--gold)}
  .pcard.dark .plabel{color:var(--turf)}
  .pcard.last .plabel{color:var(--flag)}
  .pteam{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .pteam .team-name{font-size:15px}
  .pnote{color:var(--muted);font-size:13px;margin-top:6px}

  /* Position groups */
  .poscol h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
  .posrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .posrow:last-child{border-bottom:none}
  .posrow .lead-n{color:var(--muted);font-size:12px;width:20px}

  /* Banter */
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  textarea,.tin{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--chalk);
       border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;outline:none;resize:vertical}
  textarea:focus,.tin:focus{border-color:var(--gold)}
  .quote{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);
         border-radius:10px;padding:13px 15px;margin-top:10px}
  .quote .q{font-size:15px}
  .quote .by{color:var(--muted);font-size:12px;margin-top:6px;letter-spacing:.03em}

  /* States */
  .empty{border:1px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;color:var(--muted)}
  .empty b{color:var(--chalk);display:block;font-size:16px;margin-bottom:6px}
  .banner{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);
          border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .banner .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:0 0 9px}
  .spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;
           animation:spin 1s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{color:var(--flag)}
  .hint{color:var(--muted);font-size:12px;margin-top:10px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <h1 id="leagueName">League Hub</h1>
      <div class="sub" id="leagueSub">Loading from Sleeper</div>
    </div>
    <div class="tools">
      <div class="weekpill" id="weekPill"><span class="spinner"></span></div>
      <div class="idbox">
        <label for="idInput">League</label>
        <input id="idInput" value="1389331489925132288" spellcheck="false">
        <button class="btn" id="loadBtn">Load</button>
      </div>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-v="standings">Standings</button>
    <button class="tab" data-v="power">Power Rankings</button>
    <button class="tab" data-v="recap">Weekly Recap</button>
    <button class="tab" data-v="position">Position Groups</button>
    <button class="tab" data-v="predict">Predictions</button>
    <button class="tab" data-v="history">History</button>
    <button class="tab" data-v="banter">Banter</button>
  </nav>

  <section class="view active" id="v-standings"></section>
  <section class="view" id="v-power"></section>
  <section class="view" id="v-recap"></section>
  <section class="view" id="v-position"></section>
  <section class="view" id="v-predict"></section>
  <section class="view" id="v-history"></section>
  <section class="view" id="v-banter"></section>

</div>

<script>
const API = "https://api.sleeper.app/v1";
const G = {
  leagueId:"1389331489925132288",
  state:null, league:null, users:[], rosters:[], teams:{},
  weeks:{}, lastWeek:0, started:false, players:null,
  ranks:[], banter:[], blurbs:{}, predictText:null,
  posLoaded:false, histLoaded:false
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function j(path){
  const r = await fetch(API+path);
  if(!r.ok) throw new Error(path+" -> "+r.status);
  return r.json();
}
function initials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return "??";
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function badgeColor(seed){
  const cols=["#E8B04B","#3FB27F","#5B8DEF","#C86BE0","#E5533C","#43C6C6","#E39A3B","#8C7BEF"];
  let h=0; for(const ch of (seed||"")) h=(h*31+ch.charCodeAt(0))%997;
  return cols[h%cols.length];
}
function pf(r){ return (r.settings.fpts||0) + (r.settings.fpts_decimal||0)/100; }
function paOf(r){ return (r.settings.fpts_against||0) + (r.settings.fpts_against_decimal||0)/100; }
function fmt(n){ return (Math.round(n*100)/100).toFixed(2); }
function record(t){ return t.wins+"-"+t.losses+(t.ties?("-"+t.ties):""); }
function badgeHTML(t,cls){
  const c = badgeColor(t.name);
  return '<div class="'+(cls||"badge")+'" style="background:'+c+'">'+esc(t.initials)+'</div>';
}
function teamCell(t){
  return '<div class="team-cell">'+badgeHTML(t)+
    '<div style="min-width:0"><div class="team-name">'+esc(t.name)+'</div>'+
    '<div class="team-sub">'+esc(t.owner)+'</div></div></div>';
}

/* ---------- load ---------- */
async function loadAll(){
  setWeekPill('<span class="spinner"></span>');
  $("leagueName").textContent="Loading";
  $("leagueSub").textContent="Reading from Sleeper";
  resetViews();
  try{
    G.leagueId = $("idInput").value.trim();
    const [state,league,users,rosters] = await Promise.all([
      j("/state/nfl"), j("/league/"+G.leagueId),
      j("/league/"+G.leagueId+"/users"), j("/league/"+G.leagueId+"/rosters")
    ]);
    G.state=state; G.league=league; G.users=users; G.rosters=rosters;

    const userById={}; users.forEach(u=>userById[u.user_id]=u);
    G.teams={};
    rosters.forEach(r=>{
      const u = userById[r.owner_id] || {};
      const name = (u.metadata && u.metadata.team_name) || u.display_name || ("Roster "+r.roster_id);
      G.teams[r.roster_id]={
        rosterId:r.roster_id, ownerId:r.owner_id,
        name, owner:u.display_name||"Unknown manager", initials:initials(name),
        wins:r.settings.wins||0, losses:r.settings.losses||0, ties:r.settings.ties||0,
        pf:pf(r), pa:paOf(r), roster:r
      };
    });

    G.started = league.status==="in_season" || league.status==="complete";

    $("leagueName").textContent = league.name || "League Hub";
    const teamN = rosters.length;
    $("leagueSub").textContent = (league.season||"")+" season   "+teamN+" teams   "+
      (league.status||"").replace(/_/g," ");

    if(G.started){
      await loadWeeks();
    }
    setWeekPill(weekLabel());

    computeRanks();
    renderStandings();
    renderPower();
    renderRecap();
    renderPredict();
    renderBanter();
    // position + history render lazily on tab open
    G.posLoaded=false; G.histLoaded=false;
    renderPositionPlaceholder();
    renderHistoryPlaceholder();
  }catch(e){
    setWeekPill("error");
    $("leagueName").textContent="Could not load league";
    $("leagueSub").textContent="";
    $("v-standings").innerHTML =
      '<div class="card"><div class="empty"><b>Sleeper did not return this league</b>'+
      'Check the League ID and try Load again. The ID is the long number in your Sleeper league web address. '+
      '<div class="err" style="margin-top:10px">'+esc(e.message)+'</div></div></div>';
  }
}

function weekLabel(){
  if(!G.started) return '<b>Preseason</b> &nbsp; '+(G.league.season||"");
  return 'Week <b>'+(G.lastWeek||G.state.week||1)+'</b>';
}
function setWeekPill(html){ $("weekPill").innerHTML=html; }

async function loadWeeks(){
  const cur = G.state.week||1;
  let last=0;
  // fetch weeks 1..cur, keep those with real points
  const jobs=[];
  for(let w=1;w<=cur;w++) jobs.push(j("/league/"+G.leagueId+"/matchups/"+w).then(m=>({w,m})).catch(()=>({w,m:[]})));
  const res=await Promise.all(jobs);
  res.forEach(({w,m})=>{
    const scored = Array.isArray(m) && m.some(x=>(x.points||0)>0);
    if(scored){ G.weeks[w]=m; last=Math.max(last,w); }
  });
  G.lastWeek=last;
}

/* cumulative standings through week W from matchups (for movement + weekly ranks) */
function standingsThrough(W){
  const acc={};
  Object.keys(G.teams).forEach(id=>acc[id]={w:0,l:0,t:0,pf:0});
  for(let w=1;w<=W;w++){
    const m=G.weeks[w]; if(!m) continue;
    const byMatch={};
    m.forEach(x=>{(byMatch[x.matchup_id]=byMatch[x.matchup_id]||[]).push(x);});
    Object.values(byMatch).forEach(pair=>{
      pair.forEach(x=>{ if(acc[x.roster_id]) acc[x.roster_id].pf+=(x.points||0); });
      if(pair.length===2){
        const [a,b]=pair;
        if(!acc[a.roster_id]||!acc[b.roster_id]) return;
        if(a.points>b.points){acc[a.roster_id].w++;acc[b.roster_id].l++;}
        else if(b.points>a.points){acc[b.roster_id].w++;acc[a.roster_id].l++;}
        else {acc[a.roster_id].t++;acc[b.roster_id].t++;}
      }
    });
  }
  return acc;
}
function rankOrder(acc){
  const ids=Object.keys(acc);
  const pfs=ids.map(id=>acc[id].pf);
  const mn=Math.min(...pfs), mx=Math.max(...pfs);
  const norm=v=> mx===mn?0.5:(v-mn)/(mx-mn);
  const score=id=>{
    const a=acc[id]; const g=a.w+a.l+a.t;
    const wp= g? a.w/g : 0;
    return 0.55*wp + 0.45*norm(a.pf);
  };
  return ids.map(id=>({id,score:score(id),acc:acc[id]}))
            .sort((x,y)=> y.score-x.score || y.acc.pf-x.acc.pf);
}

function computeRanks(){
  if(G.started && G.lastWeek>=1){
    const nowOrd = rankOrder(standingsThrough(G.lastWeek));
    let prevRank={};
    if(G.lastWeek>=2){
      rankOrder(standingsThrough(G.lastWeek-1)).forEach((o,i)=>prevRank[o.id]=i+1);
    }
    G.ranks = nowOrd.map((o,i)=>{
      const t=G.teams[o.id];
      const cur=i+1, prev=prevRank[o.id];
      let move=null;
      if(prev) move = prev-cur; // positive = climbed
      return {rank:cur, team:t, wins:o.acc.w, losses:o.acc.l, ties:o.acc.t, pf:o.acc.pf, move};
    });
  } else {
    // preseason: list by team name, no rank meaning
    G.ranks = Object.values(G.teams)
      .sort((a,b)=>a.name.localeCompare(b.name))
      .map((t,i)=>({rank:i+1, team:t, wins:0,losses:0,ties:0,pf:0,move:null}));
  }
  G.blurbs = {}; // deterministic filled at render time
}

/* ---------- deterministic blurbs (house voice, no em dashes) ---------- */
function autoBlurb(r, weekHigh, weekLow){
  const t=r.team;
  if(!G.started || G.lastWeek<1){
    return "Undrafted so far. Rankings go live the moment Week 1 scores post.";
  }
  const parts=[];
  parts.push(record(r)+", "+fmt(r.pf)+" points for.");
  if(r.rank===1) parts.push("Top of the league and it is earned.");
  if(r.move>0) parts.push("Up "+r.move+" spot"+(r.move>1?"s":"")+" this week.");
  else if(r.move<0) parts.push("Down "+Math.abs(r.move)+" spot"+(Math.abs(r.move)>1?"s":"")+" this week.");
  if(weekHigh && weekHigh.id===t.rosterId) parts.push("Posted the week's high score.");
  if(weekLow && weekLow.id===t.rosterId) parts.push("Also dropped the week's low score, so enjoy the ranking while it lasts.");
  return parts.join(" ");
}

/* ---------- renders ---------- */
function resetViews(){
  ["standings","power","recap","position","predict","history","banter"].forEach(v=>{
    $("v-"+v).innerHTML="";
  });
}

function renderStandings(){
  const ord = G.started && G.lastWeek>=1
    ? G.ranks.slice().sort((a,b)=> (b.wins-a.wins) || (b.pf-a.pf))
    : Object.values(G.teams).sort((a,b)=>a.name.localeCompare(b.name)).map(t=>({team:t,wins:t.wins,losses:t.losses,ties:t.ties,pf:t.pf,pa:t.pa}));
  let rows="";
  ord.forEach((r,i)=>{
    const t=r.team;
    rows+='<tr><td class="tnum" style="width:34px;color:var(--muted)">'+(i+1)+'</td>'+
      '<td>'+teamCell(t)+'</td>'+
      '<td class="num tnum">'+ (G.started?record(r):"0-0") +'</td>'+
      '<td class="num tnum">'+fmt(t.pf)+'</td>'+
      '<td class="num tnum">'+fmt(t.pa)+'</td></tr>';
  });
  const pre = !G.started ? '<div class="banner"><span class="dot"></span><div>This league has not started. Standings, records, and points fill in automatically once Week 1 games are played. Everything below is live from Sleeper right now.</div></div>' : "";
  $("v-standings").innerHTML =
    '<div class="card">'+pre+
    '<div class="eyebrow">The table</div><h2 class="sec">Standings</h2>'+
    '<p class="lead">Sorted by wins, then points for. Pulled live from your Sleeper rosters.</p>'+
    '<table><thead><tr><th>#</th><th>Team</th><th class="num">Record</th><th class="num">PF</th><th class="num">PA</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}

function weekExtremes(){
  if(!G.started || !G.weeks[G.lastWeek]) return {high:null,low:null,rows:[]};
  const m=G.weeks[G.lastWeek];
  let high=null, low=null;
  m.forEach(x=>{
    if(x.points==null) return;
    if(!high || x.points>high.points) high={id:x.roster_id,points:x.points};
    if(!low || x.points<low.points) low={id:x.roster_id,points:x.points};
  });
  const byMatch={};
  m.forEach(x=>{(byMatch[x.matchup_id]=byMatch[x.matchup_id]||[]).push(x);});
  const rows=Object.values(byMatch);
  return {high,low,rows};
}

function renderPower(){
  const {high,low}=weekExtremes();
  const wk = G.started && G.lastWeek>=1 ? "Week "+G.lastWeek : "Preseason";
  const stamp = new Date().toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});

  let rows="";
  G.ranks.forEach(r=>{
    const t=r.team;
    const blurb = G.blurbs[t.rosterId] || autoBlurb(r,high,low);
    let mv='';
    if(G.started && r.move!=null){
      if(r.move>0) mv='<span class="move up">&#9650; '+r.move+'</span>';
      else if(r.move<0) mv='<span class="move down">&#9660; '+Math.abs(r.move)+'</span>';
      else mv='<span class="move flat">= 0</span>';
    }
    const crown = (r.rank===1 && G.started) ? '<span class="crown">Top dog</span>' : '';
    rows+='<div class="rk-row '+(r.rank===1?'rk-1':'')+'">'+
      '<div class="rk-num tnum">'+r.rank+'</div>'+
      badgeHTML(t,"rk-badge")+
      '<div class="rk-main"><div class="rk-name">'+esc(t.name)+' '+crown+' '+mv+'</div>'+
      '<div class="rk-meta tnum">'+esc(t.owner)+ (G.started? '  &middot;  '+record(r)+'  &middot;  '+fmt(r.pf)+' PF':'')+'</div>'+
      '<div class="rk-blurb">'+esc(blurb)+'</div></div></div>';
  });

  const preBanner = !G.started ? '<div class="banner"><span class="dot"></span><div>Preseason. This card lists every team now and turns into a real weekly ranking the moment scores post. The export buttons already work.</div></div>' : '';

  $("v-power").innerHTML =
    '<div class="card">'+preBanner+
    '<div class="rk-head"><div><div class="eyebrow">The pecking order</div>'+
      '<h2 class="sec">Power Rankings</h2></div>'+
      '<div class="btnrow">'+
        '<button class="btn ghost" id="claudeBtn">Write blurbs with Claude</button>'+
        '<button class="btn" id="pngBtn">Save as image</button>'+
        '<button class="btn gold" id="pdfBtn">Save as PDF</button>'+
      '</div></div>'+
    '<div id="exportCard">'+
      '<div class="rk-title"><span class="name">'+esc(G.league.name||"League")+'</span>'+
        '<span class="wk">'+wk+' Power Rankings</span></div>'+
      '<div class="rk-stamp tnum">'+stamp+'  &middot;  ranked by record and points for</div>'+
      rows+
      '<div class="rk-foot">Baruka Ta Adenine League Hub. Data via Sleeper.</div>'+
    '</div>'+
    '<div class="hint">Blurbs written with Claude and any banter you add live in this session only. Re-add them after a reload.</div>'+
    '</div>';

  $("pngBtn").onclick=()=>exportCard("png");
  $("pdfBtn").onclick=()=>exportCard("pdf");
  $("claudeBtn").onclick=writeBlurbs;
}

function renderRecap(){
  if(!G.started || G.lastWeek<1){
    $("v-recap").innerHTML='<div class="card"><div class="eyebrow">The week that was</div>'+
      '<h2 class="sec">Weekly Recap</h2><div class="empty"><b>No games played yet</b>'+
      'Once Week 1 wraps, every matchup, the high score, and the week\'s low score show up here automatically.</div></div>';
    return;
  }
  const {high,low,rows}=weekExtremes();
  const hT=high?G.teams[high.id]:null, lT=low?G.teams[low.id]:null;
  let mk="";
  rows.forEach(pair=>{
    if(pair.length!==2){ return; }
    const [a,b]=pair.slice().sort((x,y)=>y.points-x.points);
    const ta=G.teams[a.roster_id], tb=G.teams[b.roster_id];
    mk+='<div class="matchup">'+
      '<div class="side win">'+badgeHTML(ta)+'<div style="min-width:0"><div class="team-name">'+esc(ta.name)+'</div><div class="team-sub">winner</div></div><div class="pts tnum" style="margin-left:auto">'+fmt(a.points)+'</div></div>'+
      '<div class="vs">VS</div>'+
      '<div class="side right lose"><div class="pts tnum">'+fmt(b.points)+'</div><div style="min-width:0"><div class="team-name">'+esc(tb.name)+'</div><div class="team-sub">&nbsp;</div></div>'+badgeHTML(tb)+'</div>'+
    '</div>';
  });
  const highBar = hT? '<div class="highline"><span class="highchip">High score</span><div><b>'+esc(hT.name)+'</b> dropped '+fmt(high.points)+' to lead the week.</div></div>':'';
  const flagBar = lT? '<div class="flagline"><span class="flagchip">Flag on the play</span><div>Week low goes to <b>'+esc(lT.name)+'</b> at '+fmt(low.points)+'. Better luck next week.</div></div>':'';
  $("v-recap").innerHTML='<div class="card"><div class="eyebrow">Week '+G.lastWeek+'</div>'+
    '<h2 class="sec">Weekly Recap</h2><p class="lead">Final scores from the most recent completed week.</p>'+
    highBar+mk+flagBar+'</div>';
}

function renderPredict(){
  if(!G.started || G.lastWeek<1){
    $("v-predict").innerHTML='<div class="card"><div class="eyebrow">The outlook</div>'+
      '<h2 class="sec">Predictions</h2><div class="empty"><b>Too early to call it</b>'+
      'The favorite, the darkhorses, the bubble, and the projected last place all appear once there are results to read.</div></div>';
    return;
  }
  const spots = (G.league.settings && G.league.settings.playoff_teams) || 6;
  const ord = G.ranks;
  const fav = ord[0];
  const last = ord[ord.length-1];
  const bubble = ord.slice(Math.max(0,spots-1), spots+1);
  // darkhorse: outside playoff line but strong PF
  const outside = ord.slice(spots);
  const dark = outside.slice().sort((a,b)=>b.pf-a.pf)[0];

  const teamMini = r => '<div class="pteam">'+badgeHTML(r.team)+'<div class="team-name">'+esc(r.team.name)+'</div></div>';
  const custom = G.predictText;

  $("v-predict").innerHTML='<div class="card"><div class="eyebrow">The outlook</div>'+
    '<h2 class="sec">Predictions</h2><p class="lead">'+(custom?esc(custom):'Heuristic read on '+spots+' playoff spots, based on record and points through Week '+G.lastWeek+'. Use the Claude button on Power Rankings to sharpen this.')+'</p>'+
    '<div class="pgrid">'+
      '<div class="pcard fav"><div class="plabel">Favorite to win it all</div>'+teamMini(fav)+
        '<div class="pnote">'+esc(record(fav))+', league-best profile at '+fmt(fav.pf)+' PF.</div></div>'+
      '<div class="pcard dark"><div class="plabel">Darkhorse</div>'+(dark?teamMini(dark)+
        '<div class="pnote">Outside the current cut but '+fmt(dark.pf)+' PF says the wins are coming.</div>':'<div class="pnote">No clear darkhorse yet.</div>')+'</div>'+
      '<div class="pcard"><div class="plabel">Bubble watch</div>'+bubble.map(teamMini).join("")+
        '<div class="pnote">Sitting on the playoff line. Every week matters now.</div></div>'+
      '<div class="pcard last"><div class="plabel">Tracking toward last</div>'+teamMini(last)+
        '<div class="pnote">'+esc(record(last))+', '+fmt(last.pf)+' PF. The basement is calling.</div></div>'+
    '</div></div>';
}

/* ---------- position groups (lazy) ---------- */
function renderPositionPlaceholder(){
  if(!G.started || G.lastWeek<1){
    $("v-position").innerHTML='<div class="card"><div class="eyebrow">Who has the horses</div>'+
      '<h2 class="sec">Position Groups</h2><div class="empty"><b>Nothing to rank yet</b>'+
      'This ranks the best starters at each position by points scored. It needs games first.</div></div>';
    return;
  }
  $("v-position").innerHTML='<div class="card"><div class="eyebrow">Who has the horses</div>'+
    '<h2 class="sec">Position Groups</h2><p class="lead">Best starters at each position by total points through Week '+G.lastWeek+'.</p>'+
    '<div class="empty"><span class="spinner"></span> &nbsp; Loading the player list from Sleeper. This one is a big file, give it a moment.</div></div>';
}
async function loadPosition(){
  if(G.posLoaded || !G.started || G.lastWeek<1) return;
  try{
    if(!G.players) G.players = await j("/players/nfl");
    const totals={}; // roster -> pos -> pts
    for(let w=1;w<=G.lastWeek;w++){
      const m=G.weeks[w]; if(!m) continue;
      m.forEach(x=>{
        const starters=x.starters||[], sp=x.starters_points||[];
        starters.forEach((pid,i)=>{
          const p=G.players[pid]; if(!p) return;
          const pos=p.position||"NA";
          totals[x.roster_id]=totals[x.roster_id]||{};
          totals[x.roster_id][pos]=(totals[x.roster_id][pos]||0)+(sp[i]||0);
        });
      });
    }
    const positions=["QB","RB","WR","TE","K","DEF"];
    let cols="";
    positions.forEach(pos=>{
      const board=Object.keys(totals).map(rid=>({t:G.teams[rid],v:totals[rid][pos]||0}))
        .filter(x=>x.t).sort((a,b)=>b.v-a.v).slice(0,3);
      if(board.length===0 || board[0].v===0) return;
      let rows=board.map((b,i)=>'<div class="posrow"><div class="team-cell"><span class="lead-n tnum">'+(i+1)+'</span>'+badgeHTML(b.t)+'<div class="team-name">'+esc(b.t.name)+'</div></div><div class="tnum" style="font-weight:800">'+fmt(b.v)+'</div></div>').join("");
      cols+='<div class="poscol card" style="margin-top:14px"><h3>'+pos+'</h3>'+rows+'</div>';
    });
    $("v-position").innerHTML='<div class="card"><div class="eyebrow">Who has the horses</div>'+
      '<h2 class="sec">Position Groups</h2><p class="lead">Best starters at each position by total points through Week '+G.lastWeek+'.</p></div>'+cols;
    G.posLoaded=true;
  }catch(e){
    $("v-position").innerHTML='<div class="card"><div class="empty err">Could not build position groups. '+esc(e.message)+'</div></div>';
  }
}

/* ---------- history (lazy) ---------- */
function renderHistoryPlaceholder(){
  $("v-history").innerHTML='<div class="card"><div class="eyebrow">The record book</div>'+
    '<h2 class="sec">League History</h2><div class="empty"><span class="spinner"></span> &nbsp; Walking back through past seasons on Sleeper.</div></div>';
}
async function loadHistory(){
  if(G.histLoaded) return;
  const seasons=[];
  let prev = G.league.previous_league_id;
  let guard=0;
  try{
    while(prev && prev!=="0" && guard<15){
      guard++;
      const L=await j("/league/"+prev);
      let champ=null;
      try{
        const [wb,us,rs]=await Promise.all([
          j("/league/"+prev+"/winners_bracket").catch(()=>[]),
          j("/league/"+prev+"/users").catch(()=>[]),
          j("/league/"+prev+"/rosters").catch(()=>[])
        ]);
        const uById={}; us.forEach(u=>uById[u.user_id]=u);
        const rById={}; rs.forEach(r=>rById[r.roster_id]=r);
        // final = highest round with a placement 1
        let fin=null;
        (wb||[]).forEach(g=>{ if(g.p===1) fin=g; });
        if(!fin && wb && wb.length) fin=wb.reduce((a,b)=>(b.r||0)>(a.r||0)?b:a,wb[0]);
        if(fin && fin.w){
          const r=rById[fin.w]; const u=r?uById[r.owner_id]:null;
          champ = u ? ((u.metadata&&u.metadata.team_name)||u.display_name) : ("Roster "+fin.w);
        }
      }catch(_){}
      seasons.push({season:L.season, name:L.name, champ});
      prev = L.previous_league_id;
    }
  }catch(e){}
  let html='<div class="card"><div class="eyebrow">The record book</div><h2 class="sec">League History</h2>';
  if(seasons.length===0){
    html+='<div class="empty"><b>History starts this season</b>'+
      'No earlier seasons are linked to this league on Sleeper. After year one, past champions and standings will stack up here on their own.</div>';
  }else{
    html+='<p class="lead">Champions from every prior season linked on Sleeper.</p><table><thead><tr><th>Season</th><th>League</th><th>Champion</th></tr></thead><tbody>';
    seasons.forEach(s=>{
      html+='<tr><td class="tnum">'+esc(s.season||"")+'</td><td>'+esc(s.name||"")+'</td><td><b style="color:var(--gold)">'+esc(s.champ||"Unknown")+'</b></td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='</div>';
  $("v-history").innerHTML=html;
  G.histLoaded=true;
}

/* ---------- banter (in-session) ---------- */
function renderBanter(){
  let list = G.banter.map((b,i)=>'<div class="quote"><div class="q">'+esc(b.q)+'</div><div class="by">'+esc(b.by||"Anonymous")+'</div></div>').join("");
  if(!list) list='<div class="empty"><b>Nothing added yet</b>Paste the funniest thing said in the group chat this week. It shows up here and gives the league its receipts.</div>';
  $("v-banter").innerHTML='<div class="card"><div class="eyebrow">Receipts</div>'+
    '<h2 class="sec">League Banter</h2><p class="lead">Sleeper does not share the group chat, so drop the best lines in yourself. Saved for this session.</p>'+
    '<textarea id="bq" rows="2" placeholder="The quote"></textarea>'+
    '<input class="tin" id="bby" style="margin-top:8px" placeholder="Who said it">'+
    '<div class="btnrow"><button class="btn gold" id="baddBtn">Add quote</button></div>'+
    '<div style="margin-top:12px">'+list+'</div></div>';
  $("baddBtn").onclick=()=>{
    const q=$("bq").value.trim(); if(!q) return;
    G.banter.unshift({q,by:$("bby").value.trim()});
    renderBanter();
  };
}

/* ---------- export ---------- */
async function exportCard(kind){
  const el=$("exportCard");
  const wk = G.started && G.lastWeek>=1 ? "Week-"+G.lastWeek : "Preseason";
  const base=(G.league.name||"League").replace(/[^a-z0-9]+/gi,"-")+"-"+wk+"-Power-Rankings";
  const canvas=await html2canvas(el,{backgroundColor:"#0d1730",scale:2,useCORS:true});
  if(kind==="png"){
    canvas.toBlob(b=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b); a.download=base+".png"; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    });
  }else{
    const img=canvas.toDataURL("image/png");
    const {jsPDF}=window.jspdf;
    const pw=canvas.width, ph=canvas.height;
    const pdf=new jsPDF({orientation: ph>pw?"portrait":"landscape", unit:"pt", format:[pw,ph]});
    pdf.addImage(img,"PNG",0,0,pw,ph);
    pdf.save(base+".pdf");
  }
}

/* ---------- Claude blurbs (optional, in-artifact API) ---------- */
async function writeBlurbs(){
  const btn=$("claudeBtn"); const orig=btn.textContent;
  btn.textContent="Writing..."; btn.disabled=true;
  try{
    const {high,low}=weekExtremes();
    const rows=G.ranks.map(r=>({
      rank:r.rank, team:r.team.name, owner:r.team.owner,
      record: G.started? (r.wins+"-"+r.losses+(r.ties?"-"+r.ties:"")) : "0-0",
      pointsFor: Math.round(r.pf*100)/100, move:r.move,
      weekHigh: high && high.id===r.team.rosterId,
      weekLow: low && low.id===r.team.rosterId
    }));
    const prompt =
"You are writing power ranking blurbs for a fantasy football league called \""+(G.league.name||"our league")+"\". "+
"State is: "+(G.started?("in season, through week "+G.lastWeek):"preseason, no games yet")+". "+
"Here is the ranked data as JSON:\n"+JSON.stringify(rows)+"\n\n"+
"Write one blurb per team, 1 to 2 sentences, sharp and specific, using the record and points. "+
"Tone is confident league-commissioner banter with light roasting. Reward the leaders, needle the bottom. "+
"Hard rules: never use an em dash, never use cliches like game-changer or seamless or journey, "+
"attach the number when you have it. Also write one short paragraph called predictions with the favorite, "+
"a darkhorse, the bubble, and who is tracking toward last. "+
"Return ONLY valid JSON, no markdown, shaped exactly: "+
"{\"blurbs\":[{\"team\":\"...\",\"text\":\"...\"}],\"predictions\":\"...\"}";
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    });
    const data=await res.json();
    const text=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("").replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(text);
    (parsed.blurbs||[]).forEach(b=>{
      const t=Object.values(G.teams).find(x=>x.name===b.team);
      if(t) G.blurbs[t.rosterId]=b.text;
    });
    if(parsed.predictions) G.predictText=parsed.predictions;
    renderPower(); renderPredict();
  }catch(e){
    btn.textContent="Claude unavailable"; 
    setTimeout(()=>{btn.textContent=orig; btn.disabled=false;},2200);
    return;
  }
  btn.textContent=orig; btn.disabled=false;
}

/* ---------- tabs ---------- */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));
  const v=b.dataset.v;
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("active",s.id==="v-"+v));
  if(v==="position") loadPosition();
  if(v==="history") loadHistory();
});
$("loadBtn").onclick=loadAll;
$("idInput").addEventListener("keydown",e=>{if(e.key==="Enter")loadAll();});

loadAll();
</script>
